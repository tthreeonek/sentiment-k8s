# Grafana (чарт grafana/grafana): источник данных Prometheus и дашборд подключаются через provisioning.
adminUser: admin
adminPassword: "Grafana2026!"

persistence:
  enabled: false
deploymentStrategy:
  type: Recreate

resources:
  requests: { cpu: 20m, memory: 128Mi }
  limits: { memory: 320Mi }

# на 1 vCPU первый старт (миграции БД) идёт долго
livenessProbe:
  httpGet: { path: /api/health, port: 3000 }
  initialDelaySeconds: 120
  timeoutSeconds: 10
  failureThreshold: 10

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        jsonData:
          timeInterval: 15s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards/default

# ConfigMap monitoring/sentiment-dashboard (grafana-dashboard-cm.yaml) монтируется в Grafana
dashboardsConfigMaps:
  default: sentiment-dashboard
