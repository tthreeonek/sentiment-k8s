apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentiment-api
  namespace: ai-app
spec:
  ingressClassName: nginx          # аддон minikube ingress (ingress-nginx)
  rules:
    - http:
        paths:
          - path: /api             # все запросы /api/* -> сервис sentiment-api
            pathType: Prefix
            backend:
              service:
                name: sentiment-api
                port:
                  number: 80
