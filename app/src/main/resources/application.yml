server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: sentiment-api
  jmx:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness и /readiness для Kubernetes
  metrics:
    tags:
      application: sentiment-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
